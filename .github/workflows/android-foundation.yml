name: HTQ 6.1 Android foundation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: htq-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify official runtime
        run: python3 scripts/prepare_runtime.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Compile and verify native data contract
        run: gradle --no-daemon :core:contractCheck :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Run Android storage and bundled-resource test
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          echo no | avdmanager create avd --force -n htq_ci -k 'system-images;android-35;google_apis;x86_64'
          emulator -avd htq_ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/htq-emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 360 adb wait-for-device
          timeout 360 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 5; done'
          adb shell input keyevent 82
          gradle --no-daemon :app:connectedDebugAndroidTest
      # No public releases or APK artifact uploads while release_ready=false.
