name: HTQ Android native verification
on:
  push:
    branches: [main, verify-6.2, verify-6.3, verify-6.4, verify-6.5, verify-7]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: htq-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify official runtime
        run: python3 scripts/prepare_runtime.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Install Linux emulator runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libpulse0 libasound2t64 libnss3 libdbus-1-3 \
            libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 \
            libxcomposite1 libxcursor1 libxdamage1 libxi6 libxtst6 libxrandr2 \
            libxkbfile1 libxkbcommon0 libxkbcommon-x11-0 \
            libgl1 libegl1 libgbm1 libvulkan1 libfontconfig1 libfreetype6
      - name: Verify emulator host dependencies before building
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:?Android SDK is missing}"
          emu="$sdk/emulator/emulator"
          qemu="$sdk/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          test -x "$emu"
          test -x "$qemu"
          test -x "$sdk/platform-tools/adb"
          sudo chmod a+rw /dev/kvm
          if ! "$emu" -version; then
            echo '::error::Emulator executable failed its dependency check'
            ldd "$qemu" || true
            exit 1
          fi
          "$emu" -accel-check
          "$sdk/platform-tools/adb" version
      - name: Create and verify AVD in one explicit shared directory
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/htq-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf '%s\n' "ANDROID_USER_HOME=$ANDROID_USER_HOME" "ANDROID_EMULATOR_HOME=$ANDROID_EMULATOR_HOME" "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          emu="$ANDROID_SDK_ROOT/emulator/emulator"
          avdmanager create avd --force -n htq_ci -k 'system-images;android-35;google_apis;x86_64' -p "$ANDROID_AVD_HOME/htq_ci.avd" <<< 'no'
          test -s "$ANDROID_AVD_HOME/htq_ci.ini"
          test -s "$ANDROID_AVD_HOME/htq_ci.avd/config.ini"
          grep -Fx "path=$ANDROID_AVD_HOME/htq_ci.avd" "$ANDROID_AVD_HOME/htq_ci.ini"
          avdmanager list avd
          "$emu" -list-avds | grep -Fx htq_ci
      - name: Prepare licensed Noto Sans
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y fonts-noto-core
          python3 scripts/prepare_ui_font.py
      - name: Compile and verify native data contract
        run: gradle --no-daemon :core:contractCheck :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - name: Inspect built APK and source-rights gate
        if: github.ref_name == 'verify-7' || (github.ref_name == 'main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[device-qa]'))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/htq-final-qa"
          python3 scripts/final_package_qa.py app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/htq-final-qa/package.json"
      - name: Run Android storage and bundled-resource test
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_SDK_ROOT"
          emu="$sdk/emulator/emulator"
          adb="$sdk/platform-tools/adb"
          export PATH="$sdk/emulator:$sdk/platform-tools:$PATH"
          test -s "${ANDROID_AVD_HOME:?AVD directory is missing}/htq_ci.ini"
          test -s "$ANDROID_AVD_HOME/htq_ci.avd/config.ini"
          "$emu" -list-avds | grep -Fx htq_ci
          df -h "$ANDROID_AVD_HOME" "$RUNNER_TEMP"
          "$adb" start-server
          log="$RUNNER_TEMP/htq-emulator.log"
          serial=emulator-5554
          "$emu" -avd htq_ci -port 5554 -no-window -noaudio -no-boot-anim -gpu swiftshader -feature -Vulkan -no-snapshot -camera-back none -camera-front none -cores 2 -memory 2048 -partition-size 2048 > "$log" 2>&1 &
          emu_pid=$!
          cleanup() {
            rc=$?
            trap - EXIT
            set +e
            if (( rc != 0 )); then
              echo '::group::Emulator diagnostics'
              # The Gradle console may truncate assertion messages. Read its existing XML;
              # no screenshots, artifact upload, reinstall or repeated test invocation.
              python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("app/build/outputs/androidTest-results/connected")
          failures = 0
          for path in sorted(root.rglob("*.xml")):
              try:
                  for case in ET.parse(path).iter("testcase"):
                      for node in case:
                          if node.tag in ("failure", "error"):
                              failures += 1
                              print("HTQ_ANDROID_TEST_FAILURE", case.get("classname"), case.get("name"), node.get("message", ""))
                              print((node.text or "")[:16000])
              except ET.ParseError as err:
                  print("Unreadable Android test result", path.name, err)
          print("HTQ_ANDROID_FAILURE_REPORT_COUNT", failures)
          PY
              timeout -k 2s 10s "$adb" devices -l
              tail -n 120 "$log"
              if [[ $(timeout -k 2s 5s "$adb" -s "$serial" get-state 2>/dev/null) == device ]]; then
                timeout -k 2s 15s "$adb" -s "$serial" logcat -d -s HTQ_UI_QA HTQ_RENDER TestRunner AndroidRuntime
              fi
              echo '::endgroup::'
            fi
            timeout -k 2s 10s "$adb" -s "$serial" emu kill >/dev/null 2>&1
            kill -TERM "$emu_pid" 2>/dev/null
            # Emulator console shutdown can fail. Never block in an unbounded wait.
            for attempt in 1 2 3 4 5; do
              kill -0 "$emu_pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$emu_pid" 2>/dev/null; then
              kill -KILL "$emu_pid" 2>/dev/null
            else
              wait "$emu_pid" 2>/dev/null
            fi
            exit "$rc"
          }
          trap cleanup EXIT
          deadline=$((SECONDS + 600))
          while true; do
            if ! kill -0 "$emu_pid" 2>/dev/null; then
              echo '::error::Android emulator exited before boot'
              exit 1
            fi
            boot=$(timeout 10 "$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [[ "$boot" == 1 ]]; then
              package=$(timeout 10 "$adb" -s "$serial" shell pm path android 2>/dev/null || true)
              if [[ "$package" == package:* ]]; then break; fi
            fi
            if (( SECONDS >= deadline )); then
              echo '::error::Android emulator did not complete boot within 600 seconds'
              exit 1
            fi
            sleep 5
          done
          "$adb" -s "$serial" shell input keyevent 82
          "$adb" -s "$serial" shell settings put global window_animation_scale 0
          "$adb" -s "$serial" shell settings put global transition_animation_scale 0
          "$adb" -s "$serial" shell settings put global animator_duration_scale 0
          "$adb" devices -l
          if [[ "$GITHUB_REF_NAME" == "verify-7" || ("${{ github.ref_name }}" == "main" && "${{ contains(github.event.head_commit.message, '[home-qa]') }}" == "true") ]]; then
            qa="$RUNNER_TEMP/htq-final-qa"
            mkdir -p "$qa/screens"
            "$adb" -s "$serial" shell mkdir -p /data/local/tmp/htq-qa
            "$adb" -s "$serial" shell cmd connectivity airplane-mode enable
            "$adb" -s "$serial" shell svc wifi disable
            "$adb" -s "$serial" shell svc data disable
            test "$("$adb" -s "$serial" shell settings get global airplane_mode_on | tr -d '\r')" = 1
            home_qa=false
            if [[ "$GITHUB_REF_NAME" == "main" && "${{ contains(github.event.head_commit.message, '[home-qa]') }}" == "true" ]]; then
              home_qa=true
            fi
            gradle --no-daemon --max-workers=2 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.htqFinalQa=true -Pandroid.testInstrumentationRunnerArguments.htqHomeQa="$home_qa"
            "$adb" -s "$serial" pull /data/local/tmp/htq-qa/. "$qa/screens/"
            python3 - "$qa/screens" "$home_qa" <<'PY'
          import pathlib, struct, sys
          folder = pathlib.Path(sys.argv[1])
          names = ["01-home", "14-home-tablet", "15-home-landscape", "16-home-hd"] if sys.argv[2] == "true" else ["01-home", "02-learning", "03-reward", "04-garden", "05-listening", "06-match", "07-vietnamese", "08-number", "09-english", "10-story", "11-parent", "12-landscape", "13-tablet"]
          for name in names:
              f = folder / (name + ".png")
              with f.open("rb") as stream:
                  header = stream.read(24)
              assert header[:8] == b"\x89PNG\r\n\x1a\n" and header[12:16] == b"IHDR", name
              width, height = struct.unpack(">II", header[16:24])
              assert width >= 240 and height >= 240, (name, width, height)
              if name == "16-home-hd":
                  assert (width, height) == (1080, 1920), (name, width, height)
              print("HTQ_SCREENSHOT", name, width, height, f.stat().st_size)
          print("HTQ_FINAL_SCREENSHOTS_PASS", len(names))
          PY
            "$adb" -s "$serial" logcat -d -s HTQ_UI_QA > "$qa/native-qa.log"
            for marker in FINAL_OFFLINE_PASS FINAL_ACTIVITY_REOPEN_PASS FINAL_UI_METRICS NATIVE_RENDER_PASS GARDEN_FLOW_PASS PARENT_FLOW_PASS NATIVE_MOTION_MODES_PASS; do
              grep -F "$marker" "$qa/native-qa.log"
            done
            if [[ "$home_qa" == "true" ]]; then
              grep -F APPROVED_HOME_ROUTE_PASS "$qa/native-qa.log"
              grep -F APPROVED_HOME_ADAPTIVE_PASS "$qa/native-qa.log"
              grep -F APPROVED_HOME_PIXEL_PASS "$qa/native-qa.log"
              grep -F APPROVED_HOME_HD_PASS "$qa/native-qa.log"
            fi
          else
            gradle --no-daemon --max-workers=2 :app:connectedDebugAndroidTest
          fi
      - name: Save final QA evidence (no APK)
        if: (github.ref_name == 'verify-7' || (github.ref_name == 'main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[home-qa]'))) && success()
        uses: actions/upload-artifact@v4
        with:
          name: HelloThucQuyen-final-QA-evidence
          path: ${{ runner.temp }}/htq-final-qa/
          if-no-files-found: error
          retention-days: 14
      - name: Encrypt complete debug APK for owner device QA
        if: github.ref_name == 'main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[device-qa]') && success()
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          qa="$RUNNER_TEMP/htq-final-qa"
          out="$RUNNER_TEMP/htq-device-qa-encrypted"
          mkdir -p "$out"
          python3 - "$apk" "$qa/package.json" <<'PY'
          import hashlib, json, pathlib, sys
          apk, report = map(pathlib.Path, sys.argv[1:])
          p = json.loads(report.read_text())
          assert p["release_ready"] is False
          assert p["apk_publication_enabled"] is False
          assert apk.stat().st_size == p["apk_bytes"]
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == p["apk_sha256"]
          PY
          openssl cms -encrypt -binary -aes-256-gcm -outform DER -in "$apk" -out "$out/HelloThucQuyen-device-test.apk.cms" qa/device-test-recipient.pem
          test -s "$out/HelloThucQuyen-device-test.apk.cms"
          cp "$qa/package.json" "$out/package.json"
          (cd "$out" && sha256sum HelloThucQuyen-device-test.apk.cms > encrypted-sha256.txt)
          echo "HTQ_PRIVATE_DEVICE_QA_ENCRYPTED_PASS"
      - name: Save encrypted device QA transfer
        if: github.ref_name == 'main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[device-qa]') && success()
        uses: actions/upload-artifact@v4
        with:
          name: HelloThucQuyen-device-QA-encrypted
          path: ${{ runner.temp }}/htq-device-qa-encrypted/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      # No public releases or plaintext APK artifact uploads while release_ready=false.
